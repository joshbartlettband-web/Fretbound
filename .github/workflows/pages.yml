# Publishes the Fretbound site to GitHub Pages: https://joshbartlettband-web.github.io/Fretbound/
#   /       the landing page (landing/)
#   /play/  the game itself (a copy of index.html)
# Setup, once: Settings > Pages > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Make the site
        run: |
          mkdir -p site/play
          cp -r landing/. site/
          cp index.html site/play/index.html
          touch site/.nojekyll
          find site -type f | sort
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
